name: Build Signed Android APK

on:
  push:
    branches:
      - 'arena/4b164227-video'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          rm -f public/Midnight-Velvet.apk
          npm ci
          npm run validate:story
          npm run build
          npx cap sync android

      - name: Decode GitHub Secret Keystore & build signed APK
        env:
          MIDNIGHT_VELVET_KEYSTORE_B64: ${{ secrets.MIDNIGHT_VELVET_KEYSTORE_B64 }}
          MIDNIGHT_VELVET_STORE_PASS: ${{ secrets.MIDNIGHT_VELVET_STORE_PASS }}
          MIDNIGHT_VELVET_KEY_ALIAS: ${{ secrets.MIDNIGHT_VELVET_KEY_ALIAS }}
          MIDNIGHT_VELVET_KEY_PASS: ${{ secrets.MIDNIGHT_VELVET_KEY_PASS }}
        run: |
          if [ -n "$MIDNIGHT_VELVET_KEYSTORE_B64" ]; then
            echo "Using permanent keystore from GitHub Actions Secrets (MIDNIGHT_VELVET_KEYSTORE_B64)"
            printf '%s' "$MIDNIGHT_VELVET_KEYSTORE_B64" | tr -d ' \n\r\t' | base64 -d > android/app/release-key.jks
          else
            echo "WARNING: MIDNIGHT_VELVET_KEYSTORE_B64 secret not set yet; using temporary fallback key"
            keytool -genkeypair -v \
              -keystore android/app/release-key.jks \
              -alias midnightvelvet \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass midnightvelvet2026 \
              -keypass midnightvelvet2026 \
              -dname "CN=Midnight Velvet, OU=Games, O=MidnightVelvet, L=Erbil, S=Erbil, C=IQ"
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          rm -f app/release-key.jks

      - name: Save signed APK to branch
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Midnight-Velvet.apk
          ls -lh release/Midnight-Velvet.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/Midnight-Velvet.apk
          git commit -m "chore: save signed Midnight-Velvet.apk [skip ci]" || true
          git push origin HEAD:arena/4b164227-video
