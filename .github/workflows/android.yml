name: Build Android APK
on:
  push:
    branches: ['arena/631cd818-video']
    paths: ['android/**', 'public/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: slicevid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Test mobile interface in Chrome
        run: node tests/native-ui.browser.mjs
      - name: Test bounded clip requests
        run: |
          python3 -m pip install yt-dlp==2026.11.23 imageio-ffmpeg==0.8.2
          export FFMPEG="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          python3 tests/clip-range-integration.py
          python3 tests/subtitle-discovery-integration.py
          python3 tests/lossless-clip-integration.py
          TEST_HTTP_10=1 python3 tests/clip-range-integration.py
          python3 -m pip install --target /tmp/yt-dlp-2025 yt-dlp==2025.11.12
          PYTHONPATH=/tmp/yt-dlp-2025 TEST_BROKEN_FFMPEG=1 python3 tests/clip-range-integration.py
          PYTHONPATH=/tmp/yt-dlp-2025 python3 tests/subtitle-discovery-integration.py
          PYTHONPATH=/tmp/yt-dlp-2025 python3 tests/lossless-clip-integration.py
      - run: npx cap sync android
      - name: Build FFmpeg for bounded MP4 clip downloads
        run: |
          if ! android/scripts/build-clip-ffmpeg.sh > /tmp/clip-ffmpeg-build.log 2>&1; then
            error=$(tail -n 8 /tmp/clip-ffmpeg-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error::$error"
            exit 1
          fi
      - name: Configure release key when available
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo 'No signing key configured; build will be unsigned.'
          fi
      - name: Build and test Android
        working-directory: android
        run: |
          if ! ./gradlew testReleaseUnitTest assembleRelease > /tmp/android-build-output 2>&1; then
            detail=$(tail -n 75 /tmp/android-build-output | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Android build::$detail"
            exit 1
          fi
      - name: Verify signed APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          tool=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$tool" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - name: Stage signed APK for delivery
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          (async () => {
            const file = fs.readFileSync('android/app/build/outputs/apk/release/app-release.apk');
            for (let i = 0, offset = 0; offset < file.length; i++, offset += 20 * 1024 * 1024) {
              const content = file.subarray(offset, offset + 20 * 1024 * 1024).toString('base64');
              const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
                method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
                body: JSON.stringify({ content, encoding: 'base64' })
              });
              const data = await response.json();
              if (!response.ok || !data.sha) throw new Error(`Could not stage APK: ${response.status} ${data.message || ''}`);
              console.log(`::notice title=APK part ${i}::${data.sha}`);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: slicevid-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

# Signing uses repository secrets; never commit keys.
