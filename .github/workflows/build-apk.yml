name: Build Signed Android APK

on:
  push:
    branches:
      - 'arena/4b164227-video'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          rm -f public/Midnight-Velvet.apk
          npm ci
          npm run validate:story
          npm run build
          npx cap sync android

      - name: Load permanent keystore & build signed APK
        run: |
          mkdir -p signing
          if [ ! -f "signing/midnight-velvet-release.jks" ]; then
            keytool -genkeypair -v \
              -keystore signing/midnight-velvet-release.jks \
              -alias midnightvelvet \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass midnightvelvet2026 \
              -keypass midnightvelvet2026 \
              -dname "CN=Midnight Velvet, OU=Games, O=MidnightVelvet, L=Erbil, S=Erbil, C=IQ"
          fi
          cp -f signing/midnight-velvet-release.jks android/app/release-key.jks
          {
            echo "MIDNIGHT VELVET — PERMANENT ANDROID SIGNING KEYSTORE"
            echo "Keystore File  : signing/midnight-velvet-release.jks"
            echo "Package Name   : com.midnightvelvet.vn"
            echo "Key Alias      : midnightvelvet"
            echo "Store Password : midnightvelvet2026"
            echo "Key Password   : midnightvelvet2026"
            echo "Validity       : 100 Years (36500 days)"
            echo "----------------------------------------------------"
            keytool -list -v -keystore signing/midnight-velvet-release.jks -alias midnightvelvet -storepass midnightvelvet2026 | grep -E "Alias name:|Valid from:|SHA1:|SHA256:"
          } > signing/KEYSTORE-INFO.txt
          cat signing/KEYSTORE-INFO.txt
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Save permanent keystore & signed APK to branch
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Midnight-Velvet.apk
          ls -lh signing/midnight-velvet-release.jks release/Midnight-Velvet.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/midnight-velvet-release.jks signing/KEYSTORE-INFO.txt release/Midnight-Velvet.apk
          git commit -m "chore: persist permanent signing keystore & signed APK [skip ci]" || true
          git push origin HEAD:arena/4b164227-video
