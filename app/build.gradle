plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videoupscaler.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.videoupscaler.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.0"

        // Pure Java: no native libraries, so one APK runs everywhere.
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No external dependencies on purpose: Java + platform APIs only.
dependencies {}
