name: Build Signed Android APK

on:
  push:
    branches:
      - 'arena/4b164227-video'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run validate:story
          npm run build
          npx cap sync android

      - name: Generate release keystore & build signed APK
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -alias midnightvelvet \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass midnightvelvet2026 \
            -keypass midnightvelvet2026 \
            -dname "CN=Midnight Velvet, OU=Games, O=MidnightVelvet, L=Erbil, S=Erbil, C=IQ"
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

      - name: Save signed APK to branch & upload artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Midnight-Velvet.apk
          ls -lh release/Midnight-Velvet.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/Midnight-Velvet.apk
          git commit -m "chore: save signed Midnight-Velvet.apk [skip ci]" || true
          git push origin HEAD:arena/4b164227-video

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midnight-Velvet-APK
          path: release/Midnight-Velvet.apk
          if-no-files-found: error
