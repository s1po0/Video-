name: Build Android APK
on:
  push:
    branches: ['arena/631cd818-video']
    paths: ['android/**', 'public/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npx cap sync android
      - run: ./gradlew assembleRelease
        working-directory: android
      - name: Package local signing tools
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p signing-tools/build-tools
          cp "$tools/apksigner" "$tools/zipalign" signing-tools/build-tools/
          cp -r "$tools/lib" signing-tools/build-tools/
          cp -r "$JAVA_HOME" signing-tools/jdk
          tar czf signing-tools.tar.gz signing-tools
      - uses: actions/upload-artifact@v4
        with:
          name: linux-signing-tools
          path: signing-tools.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: slicevid-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
