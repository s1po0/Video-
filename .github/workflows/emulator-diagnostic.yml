name: Android emulator diagnostic
on:
  push:
    branches: ['arena/631cd818-video']
    paths: ['.github/workflows/emulator-diagnostic.yml', 'tests/emulator-diagnostic.sh']
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact v20 APK
        uses: actions/download-artifact@v4
        with:
          name: slicevid-release-apk
          path: test-apk
          run-id: 46164878129
          github-token: ${{ github.token }}
      - name: Verify APK integrity
        run: echo 'f0e61796918c7747bc76773ea13bb3f13088e6eaddbab00332de85a327480f9d  test-apk/app-release.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 3072
          script: bash tests/emulator-diagnostic.sh
