name: Caption network diagnostic
on:
  push:
    branches: ['arena/631cd818-video']
    paths: ['.github/workflows/caption-network-diagnostic.yml']
permissions:
  contents: read
jobs:
  caption-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: python3 -m pip install --user --quiet yt-dlp
      - name: Check video metadata and actual caption duration
        run: |
          python3 - <<'PY'
          import re, urllib.request, yt_dlp
          for client in ('default', 'web_safari'):
              options={'quiet': True,'no_warnings':True,'skip_download':True,'socket_timeout': 20,'retries':1}
              if client != 'default': options['extractor_args']={'youtube':{'player_client':[client]}}
              try:
                  with yt_dlp.YoutubeDL(options) as y:
                      info=y.extract_info('https://youtu.be/-CCwYkvb9xU',download=False)
                  print('::notice title=Video::%s duration=%s' % (client,info.get('duration')))
                  for category in ('subtitles','automatic_captions'):
                      tracks=info.get(category) or {}
                      print('::notice title=Available::%s %s: %s' % (client,category,', '.join(tracks.keys())[:1500]))
                      for lang in (k for k in tracks if k == 'ar' or k.endswith('-orig')):
                          track=next((x for x in tracks[lang] if x.get('ext')=='vtt'),None)
                          if not track: continue
                          try:
                              req=urllib.request.Request(track['url'],headers=info.get('http_headers',{}))
                              with urllib.request.urlopen(req,timeout=40) as response: body=response.read(40000000).decode('utf-8','replace')
                              ts=re.findall(r'(\d{2,}:\d\d:\d\d\.\d{3})',body)
                              print('::notice title=Track::%s %s %s bytes=%s first=%s last=%s' % (client, category,lang,len(body),ts[0] if ts else 'none',ts[-1] if ts else 'none'))
                          except Exception as e: print('::warning title=Track request failed::%s %s %s %s' % (client,category,lang,type(e).__name__))
              except Exception as e:
                  print('::warning title=Extraction failed::%s %s %s' % (client,type(e).__name__, re.sub(r'https?://\S+','[URL]',str(e))[:700].replace('%','%25').replace('\n','%0A')))
          PY
